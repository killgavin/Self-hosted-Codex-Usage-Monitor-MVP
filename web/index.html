<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Usage Monitor</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main id="dashboard-shell" class="dashboard-shell" aria-labelledby="page-title">
      <header class="page-header">
        <p class="eyebrow">Self-hosted dashboard</p>
        <h1 id="page-title">Codex Usage Monitor</h1>
      </header>

      <section class="panel" aria-labelledby="connection-title">
        <h2 id="connection-title">Connection</h2>
        <label for="server-token">Server API token</label>
        <div class="token-row">
          <input id="server-token" name="server-token" type="password" autocomplete="off" spellcheck="false">
          <button id="connect-button" type="button">Connect</button>
        </div>
        <p id="connection-status" role="status">Not connected</p>
      </section>

      <section class="panel" aria-labelledby="login-title">
        <h2 id="login-title">ChatGPT login</h2>
        <p id="login-state" role="status">Checking login status…</p>
        <p id="login-error" class="error" role="alert" hidden></p>
        <section id="device-code" aria-labelledby="device-code-title" hidden>
          <h3 id="device-code-title">Device verification</h3>
          <p><a id="verification-link" target="_blank" rel="noopener noreferrer" hidden>Open verification page</a></p>
          <p id="user-code-label" hidden>User code: <strong id="user-code"></strong></p>
          <button id="cancel-button" type="button">Cancel</button>
        </section>
        <div class="actions">
          <button id="login-button" type="button">Log in</button>
          <button id="logout-button" type="button" hidden>Log out</button>
        </div>
      </section>

      <div class="dashboard-grid">
        <section id="account-summary" class="panel" aria-labelledby="account-title">
          <h2 id="account-title">Account</h2>
          <p>Connect to load account status.</p>
        </section>

        <section id="reset-credit-summary" class="panel" aria-labelledby="reset-credit-title">
          <h2 id="reset-credit-title">Reset credits</h2>
          <p>Connect to load reset credits.</p>
        </section>
      </div>

      <section class="panel" aria-labelledby="rate-limits-title">
        <h2 id="rate-limits-title">Rate limits</h2>
        <div id="rate-limit-list" aria-live="polite"></div>
      </section>

      <footer class="last-updated">
        Last updated: <time id="last-updated">Never</time>
      </footer>
    </main>
    <script type="module" src="/assets/app.mjs"></script>
  </body>
</html>
